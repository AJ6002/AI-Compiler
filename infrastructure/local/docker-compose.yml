services:
  postgres:
    image: postgres:16-alpine
    container_name: compiler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiconnex
      POSTGRES_PASSWORD: aiconnex_dev_password
      POSTGRES_DB: compiler_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiconnex -d compiler_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    container_name: compiler-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=aiconnex
      - POSTGRES_PWD=aiconnex_dev_password
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
      - "8233:8233"

volumes:
  postgres_data:
