[project]
name = "aiconnex-compiler"
version = "0.1.0"
description = "AICONNEX Industrial Excel Compiler: deterministic ingestion service for industrial spreadsheets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.12",
    "pyarrow>=26.0.0",
    "tzdata>=2026.5",
    "python-calamine>=0.3.0",
    "docker>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
compiler = "apps.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compiler", "apps"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["apps/**/*.py", "src/**/*.py", "tests/**/*.py", "tools/**/*.py"]
exclude = [
    ".agent",
    ".agents",
    ".venv",
    "infrastructure",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
